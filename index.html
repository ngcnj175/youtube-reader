<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTubeコメント読み上げ</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ee9ca7 50%, #ffdde1 75%, #a1c4fd 100%);
            --card-bg: rgba(255, 255, 255, 0.45);
            --text-color: #333;
            --accent-color: #ff6b9d;
            --player-bg: rgba(255, 255, 255, 0.5);
            --player-icon: #555;
            --settings-bg: rgba(255, 255, 255, 0.7);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --card-bg: rgba(30, 30, 50, 0.5);
            --text-color: #eee;
            --accent-color: #ff6b9d;
            --player-bg: rgba(30, 30, 50, 0.5);
            --player-icon: #fff;
            --settings-bg: rgba(20, 20, 35, 0.7);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-bg: rgba(255, 255, 255, 0.6);
            --text-color: #333;
            --accent-color: #ff6b9d;
            --player-bg: rgba(255, 255, 255, 0.7);
            --player-icon: #555;
            --settings-bg: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        /* URL Input */
        .url-section {
            margin-bottom: 20px;
        }

        .url-input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            outline: none;
            font-family: inherit;
            text-align: center;
        }

        .url-input::placeholder {
            color: #777;
        }

        /* Video Title */
        .video-title-section {
            margin-bottom: 15px;
            display: none;
        }

        .video-title-section.show {
            display: block;
        }

        .video-title {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 12px 20px;
            overflow: hidden;
            white-space: nowrap;
        }

        .video-title-text {
            display: inline-block;
            font-weight: 700;
            font-size: 15px;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        /* Comments Section */
        .comments-section {
            display: none;
        }

        .comments-section.show {
            display: block;
        }

        .comments-list {
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            padding-right: 5px;
        }

        .comment-item {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .comment-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .comment-item.active {
            background: rgba(255, 107, 157, 0.3);
            border: 2px solid var(--accent-color);
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-content {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .comment-author {
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-color);
        }

        .comment-date {
            font-size: 11px;
            color: #888;
        }

        .comment-text {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--player-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .player-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 8px;
        }

        .player-btn svg {
            width: 100%;
            height: 100%;
            fill: var(--player-icon);
        }

        .player-btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        .player-btn:active {
            transform: scale(0.92);
        }

        .player-btn.play-btn {
            width: 52px;
            height: 52px;
            background: var(--accent-color);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }

        .player-btn.play-btn svg {
            fill: white;
        }

        .player-btn.play-btn:hover {
            background: #ff5588;
        }

        /* Settings Panel */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .settings-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .settings-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--settings-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px 25px 0 0;
            padding: 25px 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 201;
            max-height: 70vh;
            overflow-y: auto;
        }

        .settings-overlay.show .settings-panel {
            transform: translateY(0);
        }

        .settings-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .settings-label {
            font-size: 15px;
            font-weight: 500;
        }

        .settings-select {
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            font-family: inherit;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 28px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.toggle-slider {
            background-color: var(--accent-color);
        }

        input:checked+.toggle-slider:before {
            transform: translateX(22px);
        }

        .settings-close {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: var(--accent-color);
            color: white;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        /* Fullscreen Mode */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            z-index: 300;
            display: none;
            flex-direction: column;
        }

        .fullscreen-overlay.show {
            display: flex;
        }

        .fullscreen-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 301;
        }

        .fullscreen-title {
            font-size: 13px;
            font-weight: 500;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
            color: white;
        }

        .fullscreen-close {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-user-info {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 301;
        }

        .fullscreen-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .fullscreen-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .fullscreen-author {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .fullscreen-content {
            position: fixed;
            top: 160px;
            left: 0;
            right: 0;
            bottom: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 25px;
            overflow: hidden;
        }

        .fullscreen-comment {
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
            color: white;
            width: 100%;
            word-break: break-word;
        }

        .fullscreen-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 25px;
            z-index: 301;
        }

        .fullscreen-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .fullscreen-btn svg {
            width: 100%;
            height: 100%;
            fill: white;
        }

        .fullscreen-btn.play {
            width: 70px;
            height: 70px;
            background: white;
        }

        .fullscreen-btn.play svg {
            fill: var(--accent-color);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 107, 157, 0.3);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Speed/Volume Popup */
        .control-popup {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 150;
        }

        .control-popup.show {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-popup input[type="range"] {
            width: 150px;
            accent-color: var(--accent-color);
        }

        .control-popup-value {
            min-width: 40px;
            text-align: center;
            font-weight: 700;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
    </style>
</head>

<body data-theme="pastel">
    <div class="container">
        <!-- URL Input -->
        <div class="url-section">
            <input type="text" id="videoUrl" class="url-input" placeholder="URLを貼り付けると自動で始まります">
        </div>

        <!-- Video Title -->
        <div class="video-title-section" id="videoTitleSection">
            <div class="video-title">
                <span class="video-title-text" id="videoTitleText"></span>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loadingDiv">
            <div class="loading-spinner"></div>
            <div id="loadingText">コメントを取得中...</div>
        </div>

        <!-- Comments -->
        <div class="comments-section" id="commentsSection">
            <div class="comments-list" id="commentsList"></div>
        </div>
    </div>

    <!-- Player Bar -->
    <div class="player-bar">
        <button class="player-btn" id="settingsBtn" title="設定">
            <svg viewBox="0 0 24 24">
                <path
                    d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
            </svg>
        </button>
        <button class="player-btn" id="translateBtn" title="翻訳">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12.65 15.67c.14-.36.05-.77-.23-1.05l-2.09-2.06.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.54-1.44zm4.35-5.67h-2L11 22h2l1.12-3h4.75L20 22h2l-5-12zm-2.62 7l1.62-4.33L17.62 17h-3.24z" />
            </svg>
        </button>
        <button class="player-btn" id="prevBtn" title="前へ">
            <svg viewBox="0 0 24 24">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
        </button>
        <button class="player-btn play-btn" id="playBtn" title="再生/停止">
            <svg viewBox="0 0 24 24" id="playIcon">
                <path d="M8 5v14l11-7z" />
            </svg>
        </button>
        <button class="player-btn" id="nextBtn" title="次へ">
            <svg viewBox="0 0 24 24">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
        </button>
        <button class="player-btn" id="fullscreenBtn" title="全画面">
            <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
            </svg>
        </button>
        <button class="player-btn" id="speedBtn" title="速度">
            <svg viewBox="0 0 24 24">
                <path
                    d="M10 8v8l6-4-6-4zm11-5H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z" />
            </svg>
        </button>
        <button class="player-btn" id="volumeBtn" title="音量">
            <svg viewBox="0 0 24 24">
                <path
                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
            </svg>
        </button>
    </div>

    <!-- Speed Popup -->
    <div class="control-popup" id="speedPopup">
        <span>速度</span>
        <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
        <span class="control-popup-value" id="speedValue">1.0x</span>
    </div>

    <!-- Volume Popup -->
    <div class="control-popup" id="volumePopup">
        <span>音量</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
        <span class="control-popup-value" id="volumeValue">100%</span>
    </div>

    <!-- Settings Overlay -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="settings-title">設定</div>

            <div class="settings-item">
                <span class="settings-label">コメント並び替え</span>
                <select class="settings-select" id="sortOrder">
                    <option value="relevance">おすすめ順</option>
                    <option value="time">新しい順</option>
                    <option value="oldest">古い順</option>
                </select>
            </div>

            <div class="settings-item">
                <span class="settings-label">連続再生</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="continuousToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="settings-item">
                <span class="settings-label">ナンバリング表示</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="numberingToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="settings-item">
                <span class="settings-label">UIテーマ</span>
                <select class="settings-select" id="themeSelect">
                    <option value="pastel">パステル</option>
                    <option value="light">ライト</option>
                    <option value="dark">ダーク</option>
                </select>
            </div>

            <button class="settings-close" id="settingsClose">閉じる</button>
        </div>
    </div>

    <!-- Fullscreen Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <div class="fullscreen-header">
            <button class="fullscreen-close" id="fullscreenClose">✕</button>
            <div class="fullscreen-title" id="fullscreenTitle"></div>
            <div style="width: 36px;"></div>
        </div>
        <div class="fullscreen-user-info">
            <div class="fullscreen-avatar" id="fullscreenAvatar"></div>
            <div class="fullscreen-author" id="fullscreenAuthor"></div>
        </div>
        <div class="fullscreen-content">
            <div class="fullscreen-comment" id="fullscreenComment"></div>
        </div>
        <div class="fullscreen-controls">
            <button class="fullscreen-btn" id="fsPrevBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>
            <button class="fullscreen-btn play" id="fsPlayBtn">
                <svg viewBox="0 0 24 24" id="fsPlayIcon">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
            <button class="fullscreen-btn" id="fsNextBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        class YouTubeCommentReader {
            constructor() {
                this.comments = [];
                this.currentIndex = -1;
                this.isReading = false;
                this.synth = window.speechSynthesis;
                this.currentUtterance = null;
                this.videoTitle = '';

                // Settings
                this.sortOrder = 'relevance';
                this.continuousPlay = true;
                this.showNumbering = true;
                this.speechRate = 1.0;
                this.speechVolume = 1.0;

                // State
                this.MAX_COMMENTS = 1000;
                this.WORKER_URL = 'https://youtube-comment-reader-worker.ngcnj175.workers.dev';

                // Long press timer
                this.longPressTimer = null;

                this.initEventListeners();
                this.loadVoices();

                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = () => this.loadVoices();
                }

                console.log('🚀 YouTubeコメント読み上げを起動しました');
            }

            loadVoices() {
                this.availableVoices = speechSynthesis.getVoices();
                this.japaneseVoice = this.availableVoices.find(v =>
                    v.lang.includes('ja') || v.lang.includes('JP')
                ) || this.availableVoices[0];
            }

            initEventListeners() {
                // Auto-detect paste in URL input
                const urlInput = document.getElementById('videoUrl');
                urlInput.addEventListener('input', (e) => {
                    const value = e.target.value.trim();
                    if (value && this.extractVideoId(value)) {
                        this.fetchComments();
                    }
                });

                // Player controls
                document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());
                document.getElementById('prevBtn').addEventListener('click', () => this.prevComment());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextComment());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateAllComments());
                document.getElementById('fullscreenBtn').addEventListener('click', () => this.enterFullscreen());

                // Long press for prev button (go to first)
                document.getElementById('prevBtn').addEventListener('mousedown', () => {
                    this.longPressTimer = setTimeout(() => this.goToFirst(), 800);
                });
                document.getElementById('prevBtn').addEventListener('mouseup', () => clearTimeout(this.longPressTimer));
                document.getElementById('prevBtn').addEventListener('mouseleave', () => clearTimeout(this.longPressTimer));
                document.getElementById('prevBtn').addEventListener('touchstart', (e) => {
                    this.longPressTimer = setTimeout(() => this.goToFirst(), 800);
                });
                document.getElementById('prevBtn').addEventListener('touchend', () => clearTimeout(this.longPressTimer));

                // Settings
                document.getElementById('settingsBtn').addEventListener('click', () => this.openSettings());
                document.getElementById('settingsClose').addEventListener('click', () => this.closeSettings());
                document.getElementById('settingsOverlay').addEventListener('click', (e) => {
                    if (e.target.id === 'settingsOverlay') this.closeSettings();
                });

                document.getElementById('sortOrder').addEventListener('change', (e) => {
                    this.sortOrder = e.target.value;
                    if (this.comments.length > 0) this.fetchComments();
                });

                document.getElementById('continuousToggle').addEventListener('change', (e) => {
                    this.continuousPlay = e.target.checked;
                });

                document.getElementById('numberingToggle').addEventListener('change', (e) => {
                    this.showNumbering = e.target.checked;
                    this.displayComments();
                });

                document.getElementById('themeSelect').addEventListener('change', (e) => {
                    document.body.setAttribute('data-theme', e.target.value);
                });

                // Speed/Volume popups
                document.getElementById('speedBtn').addEventListener('click', () => this.togglePopup('speedPopup'));
                document.getElementById('volumeBtn').addEventListener('click', () => this.togglePopup('volumePopup'));

                document.getElementById('speedSlider').addEventListener('input', (e) => {
                    this.speechRate = parseFloat(e.target.value);
                    document.getElementById('speedValue').textContent = this.speechRate.toFixed(1) + 'x';
                });

                document.getElementById('volumeSlider').addEventListener('input', (e) => {
                    this.speechVolume = parseFloat(e.target.value);
                    document.getElementById('volumeValue').textContent = Math.round(this.speechVolume * 100) + '%';
                });

                // Fullscreen controls
                document.getElementById('fullscreenClose').addEventListener('click', () => this.exitFullscreen());
                document.getElementById('fsPrevBtn').addEventListener('click', () => this.prevComment());
                document.getElementById('fsPlayBtn').addEventListener('click', () => this.togglePlay());
                document.getElementById('fsNextBtn').addEventListener('click', () => this.nextComment());

                // Close popups on outside click
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('#speedBtn') && !e.target.closest('#speedPopup')) {
                        document.getElementById('speedPopup').classList.remove('show');
                    }
                    if (!e.target.closest('#volumeBtn') && !e.target.closest('#volumePopup')) {
                        document.getElementById('volumePopup').classList.remove('show');
                    }
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    // Don't trigger if typing in input
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                    switch (e.code) {
                        case 'Space':
                            e.preventDefault();
                            this.togglePlay();
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.prevComment();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.nextComment();
                            break;
                    }
                });
            }

            togglePopup(id) {
                const popup = document.getElementById(id);
                const isShowing = popup.classList.contains('show');
                document.querySelectorAll('.control-popup').forEach(p => p.classList.remove('show'));
                if (!isShowing) popup.classList.add('show');
            }

            openSettings() {
                document.getElementById('settingsOverlay').classList.add('show');
            }

            closeSettings() {
                document.getElementById('settingsOverlay').classList.remove('show');
            }

            enterFullscreen() {
                if (this.comments.length === 0) return;
                document.getElementById('fullscreenOverlay').classList.add('show');
                document.getElementById('fullscreenTitle').textContent = this.videoTitle;
                this.updateFullscreenComment();
            }

            exitFullscreen() {
                document.getElementById('fullscreenOverlay').classList.remove('show');
            }

            updateFullscreenComment() {
                if (this.currentIndex < 0 || this.currentIndex >= this.comments.length) return;
                const comment = this.comments[this.currentIndex];

                const commentEl = document.getElementById('fullscreenComment');
                const text = '「' + comment.text + '」';
                commentEl.textContent = text;

                // Auto-scale font size based on text length
                const textLength = text.length;
                let fontSize;
                if (textLength <= 30) {
                    fontSize = 32;
                } else if (textLength <= 60) {
                    fontSize = 26;
                } else if (textLength <= 100) {
                    fontSize = 22;
                } else if (textLength <= 150) {
                    fontSize = 18;
                } else if (textLength <= 200) {
                    fontSize = 16;
                } else {
                    fontSize = 14;
                }
                commentEl.style.fontSize = fontSize + 'px';

                document.getElementById('fullscreenAuthor').textContent = comment.author;

                const avatar = document.getElementById('fullscreenAvatar');
                if (comment.authorProfileImageUrl) {
                    avatar.innerHTML = `<img src="${comment.authorProfileImageUrl}" alt="">`;
                } else {
                    avatar.innerHTML = comment.author.charAt(0).toUpperCase();
                }
            }

            extractVideoId(url) {
                const patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                    /youtube\.com\/v\/([^&\n?#]+)/
                ];
                for (const pattern of patterns) {
                    const match = url.match(pattern);
                    if (match) return match[1];
                }
                return null;
            }

            async fetchComments() {
                const url = document.getElementById('videoUrl').value.trim();
                const videoId = this.extractVideoId(url);

                if (!videoId) return;

                this.showLoading(true);

                try {
                    // Fetch video title first
                    await this.fetchVideoTitle(videoId);

                    const comments = await this.fetchAllComments(videoId);
                    this.comments = comments;

                    this.displayComments();
                    this.showLoading(false);

                    if (this.comments.length > 0) {
                        this.currentIndex = 0;
                        this.highlightComment(0);
                    }
                } catch (error) {
                    console.error('❌ エラー:', error);
                    this.showLoading(false);
                    this.runDemoMode();
                }
            }

            async fetchVideoTitle(videoId) {
                try {
                    const response = await fetch(`${this.WORKER_URL}?videoId=${videoId}&mode=video`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.items && data.items[0]) {
                            this.videoTitle = data.items[0].snippet.title;
                        } else {
                            this.videoTitle = 'YouTube動画';
                        }
                    } else {
                        this.videoTitle = 'YouTube動画';
                    }
                } catch (e) {
                    console.log('動画タイトル取得失敗:', e);
                    this.videoTitle = 'YouTube動画';
                }
                document.getElementById('videoTitleText').textContent = this.videoTitle;
                document.getElementById('videoTitleSection').classList.add('show');
            }

            async fetchAllComments(videoId) {
                let allComments = [];
                let nextPageToken = '';
                let fetchCount = 0;
                const maxFetches = 10;

                let apiSortOrder = this.sortOrder === 'oldest' ? 'time' : this.sortOrder;

                try {
                    do {
                        const data = await this.fetchPage(videoId, apiSortOrder, nextPageToken);
                        if (!data.items) break;

                        const extracted = data.items.map(item => ({
                            author: item.snippet.topLevelComment.snippet.authorDisplayName,
                            authorProfileImageUrl: item.snippet.topLevelComment.snippet.authorProfileImageUrl,
                            text: item.snippet.topLevelComment.snippet.textDisplay.replace(/<[^>]*>/g, ''),
                            publishedAt: item.snippet.topLevelComment.snippet.publishedAt
                        }));

                        allComments = allComments.concat(extracted);
                        nextPageToken = data.nextPageToken;
                        fetchCount++;

                        document.getElementById('loadingText').textContent = `コメントを取得中... (${allComments.length}件)`;

                    } while (nextPageToken && allComments.length < this.MAX_COMMENTS && fetchCount < maxFetches);

                    if (this.sortOrder === 'oldest') {
                        allComments.reverse();
                    }

                    return allComments;
                } catch (error) {
                    throw error;
                }
            }

            async fetchPage(videoId, order, pageToken) {
                const apiUrl = `${this.WORKER_URL}?videoId=${videoId}&order=${order}&pageToken=${pageToken}&maxResults=100`;
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`API Error (${response.status})`);
                }
                return await response.json();
            }

            runDemoMode() {
                const sampleComments = [
                    { author: '太郎', text: 'この動画すごく面白いです！', authorProfileImageUrl: null },
                    { author: '花子', text: 'ありがとうございます、勉強になりました。', authorProfileImageUrl: null },
                    { author: 'ユーザー123', text: 'わかりやすい説明ですね～', authorProfileImageUrl: null },
                    { author: '山田', text: '素晴らしい内容でした！', authorProfileImageUrl: null },
                    { author: 'コメンター', text: 'また見に来ます。', authorProfileImageUrl: null },
                ];

                this.videoTitle = 'デモ動画';
                document.getElementById('videoTitleText').textContent = this.videoTitle;
                document.getElementById('videoTitleSection').classList.add('show');

                this.comments = sampleComments;
                this.displayComments();
                this.showLoading(false);
                this.currentIndex = 0;
                this.highlightComment(0);
            }

            displayComments() {
                const commentsList = document.getElementById('commentsList');
                const commentsSection = document.getElementById('commentsSection');

                commentsList.innerHTML = '';

                this.comments.forEach((comment, index) => {
                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment-item';
                    commentDiv.dataset.index = index;

                    const numberStr = this.showNumbering ? `#${index + 1} ` : '';
                    const dateStr = comment.publishedAt ? new Date(comment.publishedAt).toLocaleDateString('ja-JP') : '';

                    const avatarContent = comment.authorProfileImageUrl
                        ? `<img src="${comment.authorProfileImageUrl}" alt="">`
                        : comment.author.charAt(0).toUpperCase();

                    commentDiv.innerHTML = `
                        <div class="comment-avatar">${avatarContent}</div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <span class="comment-author">${numberStr}${this.escapeHtml(comment.author)}</span>
                                <span class="comment-date">${dateStr}</span>
                            </div>
                            <div class="comment-text">${this.escapeHtml(comment.text)}</div>
                        </div>
                    `;

                    commentDiv.addEventListener('click', () => {
                        this.startReadingFromIndex(index);
                    });

                    commentsList.appendChild(commentDiv);
                });

                commentsSection.classList.add('show');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            removeEmoji(text) {
                return text.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}\u{1F100}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{FE00}-\u{FE0F}\u{1FA00}-\u{1FAFF}]/gu, '');
            }

            highlightComment(index) {
                document.querySelectorAll('.comment-item').forEach(item => item.classList.remove('active'));
                const items = document.querySelectorAll('.comment-item');
                if (items[index]) {
                    items[index].classList.add('active');
                    items[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                this.updateFullscreenComment();
            }

            togglePlay() {
                if (this.isReading) {
                    this.stopReading();
                } else {
                    if (this.currentIndex < 0) this.currentIndex = 0;
                    this.startReadingFromIndex(this.currentIndex);
                }
            }

            startReadingFromIndex(index) {
                this.stopReading();
                this.currentIndex = index;
                this.isReading = true;
                this.updatePlayButton(true);
                this.readCurrentComment();
            }

            readCurrentComment() {
                if (this.currentIndex >= this.comments.length || !this.isReading) {
                    this.stopReading();
                    return;
                }

                this.highlightComment(this.currentIndex);

                const comment = this.comments[this.currentIndex];
                const text = this.removeEmoji(comment.text);

                const utterance = new SpeechSynthesisUtterance(text);
                this.currentUtterance = utterance;

                if (this.japaneseVoice) utterance.voice = this.japaneseVoice;
                utterance.lang = 'ja-JP';
                utterance.rate = this.speechRate;
                utterance.volume = this.speechVolume;

                utterance.onend = () => {
                    if (this.isReading && this.continuousPlay) {
                        this.currentIndex++;
                        setTimeout(() => this.readCurrentComment(), 500);
                    } else if (this.isReading) {
                        this.stopReading();
                    }
                };

                utterance.onerror = (event) => {
                    if (event.error === 'interrupted' || event.error === 'canceled') return;
                    if (this.isReading && this.continuousPlay) {
                        this.currentIndex++;
                        this.readCurrentComment();
                    }
                };

                this.synth.speak(utterance);
            }

            stopReading() {
                this.isReading = false;
                if (this.synth.speaking) this.synth.cancel();
                this.updatePlayButton(false);
            }

            updatePlayButton(isPlaying) {
                const playPath = 'M8 5v14l11-7z';
                const stopPath = 'M6 6h12v12H6z';

                document.getElementById('playIcon').innerHTML = `<path d="${isPlaying ? stopPath : playPath}"/>`;
                document.getElementById('fsPlayIcon').innerHTML = `<path d="${isPlaying ? stopPath : playPath}"/>`;
            }

            prevComment() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    if (this.isReading) {
                        this.synth.cancel();
                        this.readCurrentComment();
                    } else {
                        this.highlightComment(this.currentIndex);
                    }
                }
            }

            nextComment() {
                if (this.currentIndex < this.comments.length - 1) {
                    this.currentIndex++;
                    if (this.isReading) {
                        this.synth.cancel();
                        this.readCurrentComment();
                    } else {
                        this.highlightComment(this.currentIndex);
                    }
                }
            }

            goToFirst() {
                this.currentIndex = 0;
                if (this.isReading) {
                    this.synth.cancel();
                    this.readCurrentComment();
                } else {
                    this.highlightComment(0);
                }
            }

            async translateAllComments() {
                if (!this.comments || this.comments.length === 0) {
                    alert('翻訳するコメントがありません');
                    return;
                }

                if (!confirm('全てのコメントを日本語に翻訳しますか？')) return;

                this.showLoading(true);
                document.getElementById('loadingText').textContent = '翻訳中...';

                try {
                    const DELIMITER = " ||| ";
                    const MAX_CHUNK_SIZE = 500;
                    let chunks = [];
                    let currentChunk = [];
                    let currentLength = 0;

                    this.comments.forEach((comment) => {
                        const textLen = encodeURIComponent(comment.text).length;
                        if (currentLength + textLen + DELIMITER.length > MAX_CHUNK_SIZE) {
                            chunks.push(currentChunk.join(DELIMITER));
                            currentChunk = [];
                            currentLength = 0;
                        }
                        currentChunk.push(comment.text);
                        currentLength += textLen + DELIMITER.length;
                    });
                    if (currentChunk.length > 0) {
                        chunks.push(currentChunk.join(DELIMITER));
                    }

                    let translatedTexts = [];

                    for (let i = 0; i < chunks.length; i++) {
                        document.getElementById('loadingText').textContent = `翻訳中... (${i + 1}/${chunks.length})`;

                        const response = await fetch(this.WORKER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'translate', text: chunks[i] })
                        });

                        if (!response.ok) throw new Error('Translation failed');
                        const data = await response.json();
                        const parts = data.translated_text.split(DELIMITER.trim());
                        translatedTexts = translatedTexts.concat(parts);

                        await new Promise(r => setTimeout(r, 500));
                    }

                    this.comments.forEach((comment, index) => {
                        if (translatedTexts[index]) {
                            comment.text = translatedTexts[index];
                        }
                    });

                    this.displayComments();
                    this.highlightComment(this.currentIndex);
                } catch (e) {
                    console.error(e);
                    alert('翻訳に失敗しました');
                } finally {
                    this.showLoading(false);
                }
            }

            showLoading(show) {
                document.getElementById('loadingDiv').classList.toggle('show', show);
                if (!show) {
                    document.getElementById('loadingText').textContent = 'コメントを取得中...';
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            new YouTubeCommentReader();
        });

        // Stop speech on page unload
        window.addEventListener('beforeunload', () => {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        });
    </script>
</body>
