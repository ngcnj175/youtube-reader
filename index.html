<!DOCTYPE html>
<html lang="ja">
<!-- Version: 2.2.0 - Unified Player + Settings Panel -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTubeコメント読み上げ</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #333;
            --text-light: #666;
            --accent-color: #0066ff;
            --shadow-dark: #a3b1c6;
            --shadow-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 15px;
            padding-bottom: 120px;
        }

        /* Initial state - center URL input */
        body.initial-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        body.initial-state .container {
            width: 100%;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* URL Input - Inset Shadow */
        .url-section {
            margin-bottom: 20px;
        }

        .url-input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            background: var(--bg-color);
            color: var(--text-color);
            box-shadow: inset 5px 5px 10px var(--shadow-dark),
                inset -5px -5px 10px var(--shadow-light);
            outline: none;
            font-family: inherit;
            text-align: center;
        }

        .url-input::placeholder {
            color: #888;
        }

        /* Video Title */
        .video-title-section {
            margin-bottom: 20px;
            display: none;
            overflow: hidden;
        }

        .video-title-section.show {
            display: block;
        }

        .video-title {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            display: inline-block;
        }

        .video-title.scroll {
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        /* Comments Section */
        .comments-section {
            display: none;
            margin-bottom: 0;
            padding-bottom: 100px;
            /* Space for player bar */
        }

        .comments-section.show {
            display: block;
        }

        .comments-list {
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            padding: 5px;
            padding-bottom: 20px;
        }

        /* Comment Card - White Background */
        .comment-item {
            background: #f5f7fa;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .comment-item:hover {
            background: #fff;
        }

        .comment-item.active {
            background: #fff;
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-content {
            flex: 1;
            min-width: 0;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .comment-author {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-color);
        }

        .comment-date {
            font-size: 11px;
            color: var(--text-light);
        }

        .comment-text {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            color: var(--text-color);
        }

        /* Unified Player Panel - Fixed Bottom */
        .player-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border-radius: 25px 25px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 100;
            transition: transform 0.3s ease;
            transform: translateY(0);
        }

        .player-panel.settings-open {
            transform: translateY(0);
        }

        /* Player Controls */
        .player-controls {
            padding: 15px 25px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .player-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--bg-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
        }

        .player-btn svg {
            width: 20px;
            height: 20px;
            fill: #666;
        }

        .player-btn:hover {
            box-shadow: 2px 2px 4px var(--shadow-dark),
                -2px -2px 4px var(--shadow-light);
        }

        .player-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark),
                inset -2px -2px 4px var(--shadow-light);
        }

        .player-btn.active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark),
                inset -2px -2px 4px var(--shadow-light);
        }

        .player-btn.play-btn {
            width: 56px;
            height: 56px;
            background: var(--accent-color);
            box-shadow: 4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
        }

        .player-btn.play-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .player-btn.play-btn:hover {
            background: #0055dd;
        }

        /* Settings Section - Inside Player Panel */
        .settings-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding: 0 20px;
        }

        .player-panel.settings-open .settings-section {
            max-height: 300px;
            padding: 0 20px 20px;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
        }

        .settings-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-select {
            padding: 8px 12px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-size: 13px;
            background: var(--bg-color);
            color: var(--text-color);
            box-shadow: inset 2px 2px 4px var(--shadow-dark),
                inset -2px -2px 4px var(--shadow-light);
        }

        .settings-slider {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-slider input[type="range"] {
            width: 80px;
            accent-color: var(--accent-color);
        }

        .settings-slider-value {
            min-width: 40px;
            font-size: 12px;
            font-weight: 600;
            text-align: right;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            transition: .3s;
            border-radius: 28px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light);
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background: #ccc;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 2px 2px 4px var(--shadow-dark);
        }

        input:checked+.toggle-slider {
            background: var(--accent-color);
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2),
                inset -3px -3px 6px rgba(255, 255, 255, 0.1);
        }

        input:checked+.toggle-slider:before {
            transform: translateX(22px);
            background: white;
        }

        .settings-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            background: var(--accent-color);
            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark),
                -3px -3px 6px var(--shadow-light);
        }

        .settings-btn:hover {
            background: #0055dd;
        }

        /* Fullscreen Mode */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-color);
            z-index: 300;
            display: none;
            flex-direction: column;
        }

        .fullscreen-overlay.show {
            display: flex;
        }

        .fullscreen-header {
            padding: 20px;
            text-align: center;
        }

        .fullscreen-title {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fullscreen-user-info {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            padding: 20px 25px 0;
        }

        .fullscreen-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
        }

        .fullscreen-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .fullscreen-author {
            font-size: 14px;
            color: var(--text-light);
        }

        .fullscreen-content {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 20px 25px;
            overflow: hidden;
        }

        .fullscreen-comment {
            font-weight: 700;
            line-height: 1.6;
            text-align: left;
            color: var(--text-color);
            width: 100%;
            word-break: break-word;
        }

        .fullscreen-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 25px 35px;
            gap: 20px;
        }

        .fullscreen-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: var(--bg-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
        }

        .fullscreen-btn svg {
            width: 20px;
            height: 20px;
            fill: #666;
        }

        .fullscreen-btn.play {
            width: 65px;
            height: 65px;
            background: var(--accent-color);
        }

        .fullscreen-btn.play svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .fullscreen-btn.muted svg {
            fill: #ccc;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--shadow-dark);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--shadow-dark);
            border-radius: 3px;
        }
    </style>
</head>

<body class="initial-state">
    <div class="container">
        <!-- URL Input -->
        <div class="url-section">
            <input type="text" id="videoUrl" class="url-input" placeholder="URLをペーストして抽出開始">
        </div>

        <!-- Video Title -->
        <div class="video-title-section" id="videoTitleSection">
            <div class="video-title" id="videoTitle"></div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loadingDiv">
            <div class="loading-spinner"></div>
            <div id="loadingText">コメントを取得中...</div>
        </div>

        <!-- Comments -->
        <div class="comments-section" id="commentsSection">
            <div class="comments-list" id="commentsList"></div>
        </div>
    </div>

    <!-- Unified Player Panel -->
    <div class="player-panel" id="playerPanel">
        <!-- Player Controls -->
        <div class="player-controls">
            <button class="player-btn" id="settingsBtn" title="設定">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                </svg>
            </button>
            <button class="player-btn" id="prevBtn" title="前へ">
                <svg viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>
            <button class="player-btn play-btn" id="playBtn" title="再生/停止">
                <svg viewBox="0 0 24 24" id="playIcon">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
            <button class="player-btn" id="nextBtn" title="次へ">
                <svg viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>
            <button class="player-btn" id="fullscreenBtn" title="全画面">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                </svg>
            </button>
        </div>

        <!-- Settings Section -->
        <div class="settings-section" id="settingsSection">
            <div class="settings-item">
                <span class="settings-label">コメント並び替え</span>
                <select class="settings-select" id="sortOrder">
                    <option value="relevance">おすすめ順</option>
                    <option value="time">新しい順</option>
                    <option value="oldest">古い順</option>
                </select>
            </div>

            <div class="settings-item">
                <span class="settings-label">連続再生</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="continuousToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="settings-item">
                <span class="settings-label">ナンバリング表示</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="numberingToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="settings-item">
                <span class="settings-label">読み上げ速度</span>
                <div class="settings-slider">
                    <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
                    <span class="settings-slider-value" id="speedValue">1.0x</span>
                </div>
            </div>

            <div class="settings-item">
                <span class="settings-label">音量</span>
                <div class="settings-slider">
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
                    <span class="settings-slider-value" id="volumeValue">100%</span>
                </div>
            </div>

            <div class="settings-item">
                <span class="settings-label">全コメント翻訳</span>
                <button class="settings-btn" id="translateBtn">日本語に翻訳</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <div class="fullscreen-header">
            <div class="fullscreen-title" id="fullscreenTitle"></div>
        </div>
        <div class="fullscreen-user-info">
            <div class="fullscreen-avatar" id="fullscreenAvatar"></div>
            <div class="fullscreen-author" id="fullscreenAuthor"></div>
        </div>
        <div class="fullscreen-content" id="fullscreenContent">
            <div class="fullscreen-comment" id="fullscreenComment"></div>
        </div>
        <div class="fullscreen-controls">
            <button class="fullscreen-btn" id="fullscreenClose" title="閉じる">
                <svg viewBox="0 0 24 24">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                </svg>
            </button>
            <button class="fullscreen-btn" id="fsPrevBtn" title="前へ">
                <svg viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>
            <button class="fullscreen-btn play" id="fsPlayBtn" title="再生/停止">
                <svg viewBox="0 0 24 24" id="fsPlayIcon">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
            <button class="fullscreen-btn" id="fsNextBtn" title="次へ">
                <svg viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>
            <button class="fullscreen-btn" id="fsVolumeBtn" title="音量">
                <svg viewBox="0 0 24 24" id="fsVolumeIcon">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Version: 2.2.0 - Unified Player + Settings Panel
        class YouTubeCommentReader {
            constructor() {
                this.comments = [];
                this.currentIndex = -1;
                this.isReading = false;
                this.synth = window.speechSynthesis;
                this.currentUtterance = null;
                this.videoTitle = '';
                this.settingsOpen = false;
                this.isMuted = false;
                this.savedVolume = 1.0;

                this.sortOrder = 'relevance';
                this.continuousPlay = true;
                this.showNumbering = true;
                this.speechRate = 1.0;
                this.speechVolume = 1.0;

                this.MAX_COMMENTS = 1000;
                this.WORKER_URL = 'https://youtube-comment-reader-worker.ngcnj175.workers.dev';

                this.longPressTimer = null;

                this.initEventListeners();
                this.loadVoices();

                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = () => this.loadVoices();
                }

                console.log('🚀 YouTubeコメント読み上げ v2.2.0 を起動しました');
            }

            loadVoices() {
                this.availableVoices = speechSynthesis.getVoices();
                this.japaneseVoice = this.availableVoices.find(v =>
                    v.lang.includes('ja') || v.lang.includes('JP')
                ) || this.availableVoices[0];
            }

            initEventListeners() {
                const urlInput = document.getElementById('videoUrl');
                urlInput.addEventListener('input', (e) => {
                    const value = e.target.value.trim();
                    if (value && this.extractVideoId(value)) {
                        this.fetchComments();
                    }
                });

                document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());
                document.getElementById('prevBtn').addEventListener('click', () => this.prevComment());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextComment());
                document.getElementById('fullscreenBtn').addEventListener('click', () => this.enterFullscreen());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateAllComments());

                // Settings toggle
                document.getElementById('settingsBtn').addEventListener('click', () => this.toggleSettings());

                // Long press for prev button
                document.getElementById('prevBtn').addEventListener('mousedown', () => {
                    this.longPressTimer = setTimeout(() => this.goToFirst(), 800);
                });
                document.getElementById('prevBtn').addEventListener('mouseup', () => clearTimeout(this.longPressTimer));
                document.getElementById('prevBtn').addEventListener('mouseleave', () => clearTimeout(this.longPressTimer));
                document.getElementById('prevBtn').addEventListener('touchstart', () => {
                    this.longPressTimer = setTimeout(() => this.goToFirst(), 800);
                });
                document.getElementById('prevBtn').addEventListener('touchend', () => clearTimeout(this.longPressTimer));

                // Settings
                document.getElementById('sortOrder').addEventListener('change', (e) => {
                    this.sortOrder = e.target.value;
                    if (this.comments.length > 0) this.fetchComments();
                });

                document.getElementById('continuousToggle').addEventListener('change', (e) => {
                    this.continuousPlay = e.target.checked;
                });

                document.getElementById('numberingToggle').addEventListener('change', (e) => {
                    this.showNumbering = e.target.checked;
                    this.displayComments();
                });

                document.getElementById('speedSlider').addEventListener('input', (e) => {
                    this.speechRate = parseFloat(e.target.value);
                    document.getElementById('speedValue').textContent = this.speechRate.toFixed(1) + 'x';
                });

                document.getElementById('volumeSlider').addEventListener('input', (e) => {
                    this.speechVolume = parseFloat(e.target.value);
                    document.getElementById('volumeValue').textContent = Math.round(this.speechVolume * 100) + '%';
                    this.isMuted = this.speechVolume === 0;
                    this.updateVolumeIcon();
                });

                // Fullscreen controls
                document.getElementById('fullscreenClose').addEventListener('click', () => this.exitFullscreen());
                document.getElementById('fsPrevBtn').addEventListener('click', () => this.prevComment());
                document.getElementById('fsPlayBtn').addEventListener('click', () => this.togglePlay());
                document.getElementById('fsNextBtn').addEventListener('click', () => this.nextComment());
                document.getElementById('fsVolumeBtn').addEventListener('click', () => this.toggleMute());

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    switch (e.code) {
                        case 'Space':
                            e.preventDefault();
                            this.togglePlay();
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.prevComment();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.nextComment();
                            break;
                    }
                });
            }

            toggleSettings() {
                this.settingsOpen = !this.settingsOpen;
                const panel = document.getElementById('playerPanel');
                const btn = document.getElementById('settingsBtn');
                panel.classList.toggle('settings-open', this.settingsOpen);
                btn.classList.toggle('active', this.settingsOpen);
            }

            toggleMute() {
                if (this.isMuted) {
                    this.speechVolume = this.savedVolume || 1.0;
                    this.isMuted = false;
                } else {
                    this.savedVolume = this.speechVolume;
                    this.speechVolume = 0;
                    this.isMuted = true;
                }
                document.getElementById('volumeSlider').value = this.speechVolume;
                document.getElementById('volumeValue').textContent = Math.round(this.speechVolume * 100) + '%';
                this.updateVolumeIcon();
            }

            updateVolumeIcon() {
                const btn = document.getElementById('fsVolumeBtn');
                const icon = document.getElementById('fsVolumeIcon');
                if (this.isMuted || this.speechVolume === 0) {
                    btn.classList.add('muted');
                    icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
                } else {
                    btn.classList.remove('muted');
                    icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
                }
            }

            enterFullscreen() {
                if (this.comments.length === 0) return;
                document.getElementById('fullscreenOverlay').classList.add('show');
                document.getElementById('fullscreenTitle').textContent = this.videoTitle;
                this.updateFullscreenComment();
                this.updateVolumeIcon();
            }

            exitFullscreen() {
                document.getElementById('fullscreenOverlay').classList.remove('show');
            }

            updateFullscreenComment() {
                if (this.currentIndex < 0 || this.currentIndex >= this.comments.length) return;
                const comment = this.comments[this.currentIndex];

                const commentEl = document.getElementById('fullscreenComment');
                const contentEl = document.getElementById('fullscreenContent');
                commentEl.textContent = comment.text;

                // Auto-fit font size to container
                const containerHeight = contentEl.clientHeight - 40; // padding
                let fontSize = 28;
                commentEl.style.fontSize = fontSize + 'px';

                // Reduce font size until text fits
                while (commentEl.scrollHeight > containerHeight && fontSize > 12) {
                    fontSize -= 1;
                    commentEl.style.fontSize = fontSize + 'px';
                }

                document.getElementById('fullscreenAuthor').textContent = comment.author;

                const avatar = document.getElementById('fullscreenAvatar');
                if (comment.authorProfileImageUrl) {
                    avatar.innerHTML = `<img src="${comment.authorProfileImageUrl}" alt="">`;
                } else {
                    avatar.innerHTML = comment.author.charAt(0).toUpperCase();
                }
            }

            extractVideoId(url) {
                const patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                    /youtube\.com\/v\/([^&\n?#]+)/
                ];
                for (const pattern of patterns) {
                    const match = url.match(pattern);
                    if (match) return match[1];
                }
                return null;
            }

            async fetchComments() {
                const url = document.getElementById('videoUrl').value.trim();
                const videoId = this.extractVideoId(url);
                if (!videoId) return;

                this.showLoading(true);

                try {
                    await this.fetchVideoTitle(videoId);
                    const comments = await this.fetchAllComments(videoId);
                    this.comments = comments;
                    this.displayComments();
                    this.showLoading(false);

                    if (this.comments.length > 0) {
                        this.currentIndex = 0;
                        this.highlightComment(0);
                    }
                } catch (error) {
                    console.error('❌ エラー:', error);
                    this.showLoading(false);
                    this.runDemoMode();
                }
            }

            async fetchVideoTitle(videoId) {
                console.log('📺 動画タイトルを取得中...');

                // Show section immediately with placeholder
                const titleEl = document.getElementById('videoTitle');
                const section = document.getElementById('videoTitleSection');
                titleEl.textContent = '読み込み中...';
                section.classList.add('show');

                try {
                    const response = await fetch(`${this.WORKER_URL}?videoId=${videoId}&mode=video`);
                    console.log('📺 API応答:', response.status);

                    if (response.ok) {
                        const data = await response.json();
                        console.log('📺 取得データ:', data);

                        if (data.items && data.items[0]) {
                            this.videoTitle = data.items[0].snippet.title;
                        } else {
                            this.videoTitle = 'YouTube動画';
                        }
                    } else {
                        this.videoTitle = 'YouTube動画';
                    }
                } catch (e) {
                    console.error('📺 タイトル取得エラー:', e);
                    this.videoTitle = 'YouTube動画';
                }

                // Update title
                titleEl.textContent = this.videoTitle;
                titleEl.classList.remove('scroll');
                console.log('📺 タイトル設定:', this.videoTitle);

                // Check if scrolling is needed
                setTimeout(() => {
                    if (titleEl.scrollWidth > section.clientWidth) {
                        titleEl.textContent = this.videoTitle + '　　　　' + this.videoTitle;
                        titleEl.classList.add('scroll');
                    }
                }, 100);
            }

            async fetchAllComments(videoId) {
                let allComments = [];
                let nextPageToken = '';
                let fetchCount = 0;
                const maxFetches = 10;
                let apiSortOrder = this.sortOrder === 'oldest' ? 'time' : this.sortOrder;

                try {
                    do {
                        const data = await this.fetchPage(videoId, apiSortOrder, nextPageToken);
                        if (!data.items) break;

                        const extracted = data.items.map(item => ({
                            author: item.snippet.topLevelComment.snippet.authorDisplayName,
                            authorProfileImageUrl: item.snippet.topLevelComment.snippet.authorProfileImageUrl,
                            text: item.snippet.topLevelComment.snippet.textDisplay.replace(/<[^>]*>/g, ''),
                            publishedAt: item.snippet.topLevelComment.snippet.publishedAt
                        }));

                        allComments = allComments.concat(extracted);
                        nextPageToken = data.nextPageToken;
                        fetchCount++;
                        document.getElementById('loadingText').textContent = `コメントを取得中... (${allComments.length}件)`;

                    } while (nextPageToken && allComments.length < this.MAX_COMMENTS && fetchCount < maxFetches);

                    if (this.sortOrder === 'oldest') allComments.reverse();
                    return allComments;
                } catch (error) {
                    throw error;
                }
            }

            async fetchPage(videoId, order, pageToken) {
                const apiUrl = `${this.WORKER_URL}?videoId=${videoId}&order=${order}&pageToken=${pageToken}&maxResults=100`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`API Error (${response.status})`);
                return await response.json();
            }

            runDemoMode() {
                const sampleComments = [
                    { author: '太郎', text: 'この動画すごく面白いです！', authorProfileImageUrl: null, publishedAt: '2024-01-15' },
                    { author: '花子', text: 'ありがとうございます、勉強になりました。', authorProfileImageUrl: null, publishedAt: '2024-01-14' },
                    { author: 'ユーザー123', text: 'わかりやすい説明ですね～', authorProfileImageUrl: null, publishedAt: '2024-01-13' },
                    { author: '山田', text: '素晴らしい内容でした！', authorProfileImageUrl: null, publishedAt: '2024-01-12' },
                    { author: 'コメンター', text: 'また見に来ます。', authorProfileImageUrl: null, publishedAt: '2024-01-11' },
                ];

                this.videoTitle = 'デモ動画';
                document.getElementById('videoTitle').textContent = this.videoTitle;
                document.getElementById('videoTitleSection').classList.add('show');

                this.comments = sampleComments;
                this.displayComments();
                this.showLoading(false);
                this.currentIndex = 0;
                this.highlightComment(0);
            }

            displayComments() {
                const commentsList = document.getElementById('commentsList');
                const commentsSection = document.getElementById('commentsSection');

                // Remove initial centering state
                document.body.classList.remove('initial-state');

                commentsList.innerHTML = '';

                this.comments.forEach((comment, index) => {
                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment-item';
                    commentDiv.dataset.index = index;

                    const numberStr = this.showNumbering ? `#${index + 1} ` : '';
                    const dateStr = comment.publishedAt ? new Date(comment.publishedAt).toLocaleDateString('ja-JP') : '';

                    const avatarContent = comment.authorProfileImageUrl
                        ? `<img src="${comment.authorProfileImageUrl}" alt="">`
                        : comment.author.charAt(0).toUpperCase();

                    commentDiv.innerHTML = `
                        <div class="comment-avatar">${avatarContent}</div>
                        <div class="comment-content">
                            <div class="comment-header">
                                <span class="comment-author">${numberStr}${this.escapeHtml(comment.author)}</span>
                                <span class="comment-date">${dateStr}</span>
                            </div>
                            <div class="comment-text">${this.escapeHtml(comment.text)}</div>
                        </div>
                    `;

                    commentDiv.addEventListener('click', () => this.startReadingFromIndex(index));
                    commentsList.appendChild(commentDiv);
                });

                commentsSection.classList.add('show');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            removeEmoji(text) {
                return text.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}\u{1F100}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{FE00}-\u{FE0F}\u{1FA00}-\u{1FAFF}]/gu, '');
            }

            highlightComment(index) {
                document.querySelectorAll('.comment-item').forEach(item => item.classList.remove('active'));
                const items = document.querySelectorAll('.comment-item');
                if (items[index]) {
                    items[index].classList.add('active');
                    items[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                this.updateFullscreenComment();
            }

            togglePlay() {
                if (this.isReading) {
                    this.stopReading();
                } else {
                    if (this.currentIndex < 0) this.currentIndex = 0;
                    this.startReadingFromIndex(this.currentIndex);
                }
            }

            startReadingFromIndex(index) {
                this.stopReading();
                this.currentIndex = index;
                this.isReading = true;
                this.updatePlayButton(true);
                this.readCurrentComment();
            }

            readCurrentComment() {
                if (this.currentIndex >= this.comments.length || !this.isReading) {
                    this.stopReading();
                    return;
                }

                this.highlightComment(this.currentIndex);

                const comment = this.comments[this.currentIndex];
                const text = this.removeEmoji(comment.text);

                const utterance = new SpeechSynthesisUtterance(text);
                this.currentUtterance = utterance;

                if (this.japaneseVoice) utterance.voice = this.japaneseVoice;
                utterance.lang = 'ja-JP';
                utterance.rate = this.speechRate;
                utterance.volume = this.speechVolume;

                utterance.onend = () => {
                    if (this.isReading && this.continuousPlay) {
                        this.currentIndex++;
                        setTimeout(() => this.readCurrentComment(), 500);
                    } else if (this.isReading) {
                        this.stopReading();
                    }
                };

                utterance.onerror = (event) => {
                    if (event.error === 'interrupted' || event.error === 'canceled') return;
                    if (this.isReading && this.continuousPlay) {
                        this.currentIndex++;
                        this.readCurrentComment();
                    }
                };

                this.synth.speak(utterance);
            }

            stopReading() {
                this.isReading = false;
                if (this.synth.speaking) this.synth.cancel();
                this.updatePlayButton(false);
            }

            updatePlayButton(isPlaying) {
                const playPath = 'M8 5v14l11-7z';
                const stopPath = 'M6 6h12v12H6z';
                document.getElementById('playIcon').innerHTML = `<path d="${isPlaying ? stopPath : playPath}"/>`;
                document.getElementById('fsPlayIcon').innerHTML = `<path d="${isPlaying ? stopPath : playPath}"/>`;
            }

            prevComment() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    if (this.isReading) {
                        this.synth.cancel();
                        this.readCurrentComment();
                    } else {
                        this.highlightComment(this.currentIndex);
                    }
                }
            }

            nextComment() {
                if (this.currentIndex < this.comments.length - 1) {
                    this.currentIndex++;
                    if (this.isReading) {
                        this.synth.cancel();
                        this.readCurrentComment();
                    } else {
                        this.highlightComment(this.currentIndex);
                    }
                }
            }

            goToFirst() {
                this.currentIndex = 0;
                if (this.isReading) {
                    this.synth.cancel();
                    this.readCurrentComment();
                } else {
                    this.highlightComment(0);
                }
            }

            async translateAllComments() {
                if (!this.comments || this.comments.length === 0) {
                    alert('翻訳するコメントがありません');
                    return;
                }
                if (!confirm('全てのコメントを日本語に翻訳しますか？')) return;

                this.showLoading(true);
                document.getElementById('loadingText').textContent = '翻訳中...';

                try {
                    const DELIMITER = " ||| ";
                    const MAX_CHUNK_SIZE = 500;
                    let chunks = [];
                    let currentChunk = [];
                    let currentLength = 0;

                    this.comments.forEach((comment) => {
                        const textLen = encodeURIComponent(comment.text).length;
                        if (currentLength + textLen + DELIMITER.length > MAX_CHUNK_SIZE) {
                            chunks.push(currentChunk.join(DELIMITER));
                            currentChunk = [];
                            currentLength = 0;
                        }
                        currentChunk.push(comment.text);
                        currentLength += textLen + DELIMITER.length;
                    });
                    if (currentChunk.length > 0) chunks.push(currentChunk.join(DELIMITER));

                    let translatedTexts = [];

                    for (let i = 0; i < chunks.length; i++) {
                        document.getElementById('loadingText').textContent = `翻訳中... (${i + 1}/${chunks.length})`;
                        const response = await fetch(this.WORKER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'translate', text: chunks[i] })
                        });
                        if (!response.ok) throw new Error('Translation failed');
                        const data = await response.json();
                        const parts = data.translated_text.split(DELIMITER.trim());
                        translatedTexts = translatedTexts.concat(parts);
                        await new Promise(r => setTimeout(r, 500));
                    }

                    this.comments.forEach((comment, index) => {
                        if (translatedTexts[index]) comment.text = translatedTexts[index];
                    });

                    this.displayComments();
                    this.highlightComment(this.currentIndex);
                } catch (e) {
                    console.error(e);
                    alert('翻訳に失敗しました');
                } finally {
                    this.showLoading(false);
                }
            }

            showLoading(show) {
                document.getElementById('loadingDiv').classList.toggle('show', show);
                if (!show) document.getElementById('loadingText').textContent = 'コメントを取得中...';
            }
        }

        document.addEventListener('DOMContentLoaded', () => new YouTubeCommentReader());
        window.addEventListener('beforeunload', () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); });
    </script>
